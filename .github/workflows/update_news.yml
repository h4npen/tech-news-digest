name: Update News and Deploy to GitHub Pages

on:
  schedule:
    # 毎朝 07:00 JST (UTC 22:00 前日)
    - cron: '0 22 * * *'
    # 毎夕 18:00 JST (UTC 09:00 当日)
    - cron: '0 9 * * *'
  workflow_dispatch: # GitHub画面からの手動即時実行も可能

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Generate Newspaper & Fetch News
        run: |
          python scripts/generate_newspaper.py
          
      - name: Commit and Push Data & Newspapers
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/morning.html public/evening.html
          git commit -m "chore: auto-update newspaper and news data [skip ci]" || exit 0
          git push origin master || git push origin main || true
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Web App
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
